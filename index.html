<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: màn hình nhân viên (#/nv) tự chừa Dynamic Island và
         thanh home của iPhone bằng env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Favicon SVG: nét sắc ở mọi cỡ và tự đúng trên màn Retina. PNG 180px
         dành cho iPhone khi NV thêm link bàn vào màn hình chính (iOS không
         dùng được favicon SVG cho biểu tượng đó). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e30613" />
    <title>NPI Event · Interactive Layout Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
